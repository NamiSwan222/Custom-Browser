# Custom Browser layout choices (Settings > Look and Feel > Personalize > Layout),
# applied by src/zen/custom/custom-look.css.

# 0 compact (Zen's own), 1 comfortable, 2 large.
- name: custom.look.size
  value: 1

# 0 square, 1 rounded (Zen's own), 2 extra round.
- name: custom.look.roundness
  value: 1

# Names beside the sidebar's Library and Create New buttons.
- name: custom.look.button-labels
  value: true

# How strongly a chosen background image shows (30 subtle, 60 balanced, 90 strong).
- name: custom.personalize.background-strength
  value: 60

# Tabs in a row on top, as in Chrome (true), or in Zen's sidebar (false).
# Applied by src/zen/custom/CustomTopTabs.mjs and custom-top-tabs.css.
- name: custom.tabs.top
  value: true

# Personalize 2.0 (src/zen/custom/CustomLookExtras.mjs, custom-look.css).
# Browser font ("" = the system's) and size in px (0 = the system's).
- name: custom.look.ui-font
  value: ""
- name: custom.look.ui-font-size
  value: 0

# See-through window, 0-90 (0 off): how much Windows 11's Mica shows.
- name: custom.look.see-through
  value: 0

# Light/dark by time of day.
- name: custom.look.schedule
  value: false
- name: custom.look.dark-from
  value: "19:00"
- name: custom.look.light-from
  value: "07:00"

# Address bar at the bottom of the window.
- name: custom.look.address-bar-bottom
  value: false

# Tab style: height 0-3 (default, small, medium, large), shape 0-2 (rounded,
# square, pill), close button 0-2 (on hover, always, never).
- name: custom.tabs.style.height
  value: 0
- name: custom.tabs.style.shape
  value: 0
- name: custom.tabs.style.favicon-only
  value: false
- name: custom.tabs.style.close
  value: 0

# Per space: a background image and font for single spaces, by space id
# (JSON, set from the space's right-click menu; CustomSiteTools.mjs).
- name: custom.spaces.looks
  value: "{}"

# Custom Browser's own new tab page (custom-newtab.html). Off: Firefox's.
- name: custom.newtab.enabled
  value: true
- name: custom.newtab.layout
  value: ""
- name: custom.newtab.tiles
  value: ""
- name: custom.newtab.notes
  value: ""
