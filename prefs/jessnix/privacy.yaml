# Jessnix privacy defaults: Brave's browsing protections, done with what Firefox
# already has. Ads and trackers in pages are blocked by the bundled uBlock Origin.

# Enhanced Tracking Protection: strict. Blocks trackers, fingerprinters,
# cryptominers and social trackers in every window, and keeps each site's
# cookies to that site (like Brave Shields).
- name: browser.contentblocking.category
  value: "strict"

# Load every site over HTTPS, and ask before falling back to HTTP (Brave upgrades
# connections the same way).
- name: dom.security.https_only_mode
  value: true

# Answer cookie consent banners with "reject" where the site supports it.
- name: cookiebanners.service.mode
  value: 1

- name: cookiebanners.service.mode.privateBrowsing
  value: 1

# Remove tracking parameters (fbclid, gclid, ...) from links (Brave's query filter).
- name: privacy.query_stripping.enabled
  value: true

- name: privacy.query_stripping.enabled.pbmode
  value: true

# Make the browser harder to fingerprint (like Brave's fingerprint randomizing),
# without the site breakage of full resistFingerprinting.
- name: privacy.fingerprintingProtection
  value: true

# WebRTC (video calls) uses only the default route, so it can't reveal a local or
# VPN-hidden IP address.
- name: media.peerconnection.ice.default_address_only
  value: true

# When a link goes to another site, send only the origin as the referrer, not the
# full page address.
- name: network.http.referer.XOriginTrimmingPolicy
  value: 2
