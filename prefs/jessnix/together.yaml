# Browse Together (src/zen/jessnix/JessnixTogether.mjs): browsing with friends
# on the same LAN or a virtual LAN such as Radmin VPN.

# The name others see. Empty: "Friend" until set in the Together panel.
- name: jessnix.together.name
  value: ""

# The TCP port a room listens on. Others type host:port if it isn't this one.
- name: jessnix.together.port
  value: 47110

# On only while a session runs; the page side of Together (pointers,
# scrolling, video) only runs then. Set by the browser, not by hand.
- name: jessnix.together.active
  value: false
