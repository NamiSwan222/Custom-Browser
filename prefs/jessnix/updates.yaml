# Updates from GitHub Releases (src/zen/jessnix/JessnixUpdates.mjs): once a
# day, the latest release of NamiSwan222/Custom-Browser (fixed in the code, not
# a pref, so nothing can point it elsewhere) is compared with this browser.
- name: jessnix.update.check
  value: true
# Seconds since 1970.
- name: jessnix.update.last-check
  value: 0
- name: jessnix.update.skip-version
  value: ""

# DuckDuckGo was made the default search on this profile's first run.
- name: jessnix.search.default-set
  value: false
