# Jessnix layout choices (Settings > Look and Feel > Personalize > Layout),
# applied by src/zen/jessnix/jessnix-look.css.

# 0 compact (Zen's own), 1 comfortable, 2 large.
- name: jessnix.look.size
  value: 1

# 0 square, 1 rounded (Zen's own), 2 extra round.
- name: jessnix.look.roundness
  value: 1

# Names beside the sidebar's Library and Create New buttons.
- name: jessnix.look.button-labels
  value: true

# How strongly a chosen background image shows (30 subtle, 60 balanced, 90 strong).
- name: jessnix.personalize.background-strength
  value: 60

# Tabs in a row on top, as in Chrome (true), or in Zen's sidebar (false).
# Applied by src/zen/jessnix/JessnixTopTabs.mjs and jessnix-top-tabs.css.
- name: jessnix.tabs.top
  value: true

# Personalize 2.0 (src/zen/jessnix/JessnixLookExtras.mjs, jessnix-look.css).
# Browser font ("" = the system's) and size in px (0 = the system's).
- name: jessnix.look.ui-font
  value: ""
- name: jessnix.look.ui-font-size
  value: 0

# See-through window, 0-90 (0 off): how much Windows 11's Mica shows.
- name: jessnix.look.see-through
  value: 0

# Light/dark by time of day.
- name: jessnix.look.schedule
  value: false
- name: jessnix.look.dark-from
  value: "19:00"
- name: jessnix.look.light-from
  value: "07:00"

# Address bar at the bottom of the window.
- name: jessnix.look.address-bar-bottom
  value: false

# Tab style: height 0-3 (default, small, medium, large), shape 0-2 (rounded,
# square, pill), close button 0-2 (on hover, always, never).
- name: jessnix.tabs.style.height
  value: 0
- name: jessnix.tabs.style.shape
  value: 0
- name: jessnix.tabs.style.favicon-only
  value: false
- name: jessnix.tabs.style.close
  value: 0
