# Jessnix daily-use defaults.

# Stay signed in: offer to save passwords, fill them in on return, and keep
# cookies between sessions (nothing is cleared on close).
- name: signon.rememberSignons
  value: true

- name: signon.autofillForms
  value: true

- name: privacy.sanitize.sanitizeOnShutdown
  value: false

# Show the bookmark star in the address bar (Zen hides it; see zen-omnibox.css).
- name: jessnix.urlbar.show-bookmark-star
  value: true
