<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src chrome: moz-icon: file:; img-src chrome: moz-icon: file: page-icon: data:; style-src chrome: 'unsafe-inline'; object-src 'none'">
  <title>New Tab</title>
  <link rel="icon" href="chrome://branding/content/icon32.png">
  <link rel="stylesheet" href="chrome://browser/content/zen-styles/custom-newtab.css">
  <script src="chrome://browser/content/zen-components/custom-newtab.js" defer></script>
</head>
<body>
  <div id="background"></div>
  <main id="board"></main>
  <footer>
    <button id="edit" type="button">Edit</button>
  </footer>
  <template id="widget-clock">
    <section class="widget" data-widget="clock">
      <div class="clock-time"></div>
      <div class="clock-greeting"></div>
    </section>
  </template>
  <template id="widget-search">
    <section class="widget" data-widget="search">
      <form class="search">
        <input class="search-input" type="search" autocomplete="off" spellcheck="false">
        <button class="search-go" type="submit" aria-label="Search">→</button>
      </form>
    </section>
  </template>
  <template id="widget-tiles">
    <section class="widget" data-widget="tiles">
      <div class="tiles"></div>
      <form class="tile-add" hidden>
        <input class="tile-name" type="text" placeholder="Name" maxlength="30">
        <input class="tile-url" type="url" placeholder="https://…" maxlength="2000">
        <button type="submit">Add</button>
      </form>
    </section>
  </template>
  <template id="widget-notes">
    <section class="widget" data-widget="notes">
      <h2>Notes</h2>
      <textarea class="notes" maxlength="20000" placeholder="Anything you want to remember"></textarea>
    </section>
  </template>
</body>
</html>
