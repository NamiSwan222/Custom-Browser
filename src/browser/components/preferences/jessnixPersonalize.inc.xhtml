# Jessnix: Settings > Look and Feel > Personalize. Included at the end of the
# paneZenLooks template in zenLooksAndFeel.inc.xhtml; the logic is in
# jessnix-settings.js.

<hbox id="jessnixPersonalizeCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenLooks">
<html:h1 data-l10n-id="jessnix-personalize-title"/>
</hbox>

<groupbox id="jessnixPersonalizeGroup" data-category="paneZenLooks" hidden="true" class="highlighting-group">
  <label><html:h2 data-l10n-id="jessnix-look-header"/></label>
  <description class="description-deemphasized" data-l10n-id="jessnix-look-description"/>
  <hbox align="center">
    <label style="min-width: 9em;" control="jessnixLookSize" data-l10n-id="jessnix-look-size"/>
    <menulist id="jessnixLookSize" data-jessnix-pref="jessnix.look.size" data-jessnix-type="int">
      <menupopup>
        <menuitem data-l10n-id="jessnix-look-size-compact" value="0"/>
        <menuitem data-l10n-id="jessnix-look-size-comfortable" value="1"/>
        <menuitem data-l10n-id="jessnix-look-size-large" value="2"/>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <label style="min-width: 9em;" control="jessnixLookRoundness" data-l10n-id="jessnix-look-roundness"/>
    <menulist id="jessnixLookRoundness" data-jessnix-pref="jessnix.look.roundness" data-jessnix-type="int">
      <menupopup>
        <menuitem data-l10n-id="jessnix-look-roundness-square" value="0"/>
        <menuitem data-l10n-id="jessnix-look-roundness-rounded" value="1"/>
        <menuitem data-l10n-id="jessnix-look-roundness-round" value="2"/>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <label style="min-width: 9em;" control="jessnixLookScheme" data-l10n-id="jessnix-look-scheme"/>
    <menulist id="jessnixLookScheme" data-jessnix-pref="zen.view.window.scheme" data-jessnix-type="int">
      <menupopup>
        <menuitem data-l10n-id="jessnix-look-scheme-auto" value="2"/>
        <menuitem data-l10n-id="jessnix-look-scheme-light" value="1"/>
        <menuitem data-l10n-id="jessnix-look-scheme-dark" value="0"/>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <label style="min-width: 9em;" control="jessnixLookSide" data-l10n-id="jessnix-look-side"/>
    <menulist id="jessnixLookSide" data-jessnix-pref="zen.tabs.vertical.right-side" data-jessnix-type="bool">
      <menupopup>
        <menuitem data-l10n-id="jessnix-look-side-left" value="false"/>
        <menuitem data-l10n-id="jessnix-look-side-right" value="true"/>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <label style="min-width: 9em;" control="jessnixLookBookmarks" data-l10n-id="jessnix-look-bookmarks"/>
    <menulist id="jessnixLookBookmarks" data-jessnix-pref="browser.toolbars.bookmarks.visibility" data-jessnix-type="string">
      <menupopup>
        <menuitem data-l10n-id="jessnix-look-bookmarks-always" value="always"/>
        <menuitem data-l10n-id="jessnix-look-bookmarks-newtab" value="newtab"/>
        <menuitem data-l10n-id="jessnix-look-bookmarks-never" value="never"/>
      </menupopup>
    </menulist>
  </hbox>
  <checkbox id="jessnixLookLabels" data-l10n-id="jessnix-look-labels"
            data-jessnix-pref="jessnix.look.button-labels" data-jessnix-type="bool"/>
  <checkbox id="jessnixLookWindowButtons" data-l10n-id="jessnix-look-window-buttons"
            data-jessnix-pref="zen.view.hide-window-controls" data-jessnix-type="bool" data-jessnix-inverted="true"/>

  <label><html:h2 data-l10n-id="jessnix-personalize-name-header"/></label>
  <description class="description-deemphasized" data-l10n-id="jessnix-personalize-name-description"/>
  <hbox align="center">
    <html:input id="jessnixPersonalizeName" type="text" maxlength="40"
                data-l10n-id="jessnix-personalize-name-input"/>
    <button id="jessnixPersonalizeNameReset" data-l10n-id="jessnix-personalize-reset"/>
  </hbox>

  <label><html:h2 data-l10n-id="jessnix-personalize-icon-header"/></label>
  <description class="description-deemphasized" data-l10n-id="jessnix-personalize-icon-description"/>
  <hbox align="center">
    <html:img id="jessnixPersonalizeIconPreview" width="32" height="32" alt=""/>
    <button id="jessnixPersonalizeIconChoose" data-l10n-id="jessnix-personalize-choose-image"/>
    <button id="jessnixPersonalizeIconReset" data-l10n-id="jessnix-personalize-use-default"/>
  </hbox>

  <label><html:h2 data-l10n-id="jessnix-personalize-background-header"/></label>
  <description class="description-deemphasized" data-l10n-id="jessnix-personalize-background-description"/>
  <hbox align="center">
    <html:img id="jessnixPersonalizeBackgroundPreview" width="96" height="54" alt="" hidden="true"/>
    <button id="jessnixPersonalizeBackgroundChoose" data-l10n-id="jessnix-personalize-choose-image"/>
    <button id="jessnixPersonalizeBackgroundReset" data-l10n-id="jessnix-personalize-remove-image"/>
  </hbox>
  <hbox align="center">
    <label id="jessnixPersonalizeStrengthLabel" control="jessnixPersonalizeStrength"
           data-l10n-id="jessnix-personalize-background-strength"/>
    <menulist id="jessnixPersonalizeStrength" preference="jessnix.personalize.background-strength">
      <menupopup>
        <menuitem data-l10n-id="jessnix-personalize-strength-subtle" value="30"/>
        <menuitem data-l10n-id="jessnix-personalize-strength-balanced" value="60"/>
        <menuitem data-l10n-id="jessnix-personalize-strength-strong" value="90"/>
      </menupopup>
    </menulist>
  </hbox>

  <label><html:h2 data-l10n-id="jessnix-personalize-colors-header"/></label>
  <description class="description-deemphasized" data-l10n-id="jessnix-personalize-colors-description"/>
  <hbox align="center">
    <label id="jessnixPersonalizeAccentLabel" control="jessnixPersonalizeAccent"
           data-l10n-id="jessnix-personalize-accent-label"/>
    <html:input id="jessnixPersonalizeAccent" type="color"/>
    <button id="jessnixPersonalizeAccentReset" data-l10n-id="jessnix-personalize-accent-system"/>
  </hbox>

  <description id="jessnixPersonalizeError" class="description-deemphasized" hidden="true"/>
</groupbox>
